<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EcoAnalyzer AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f0f4f0; }
        .leaf-gradient { background: linear-gradient(135deg, #2d5a27, #4f9d44); }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center p-4 md:p-10">

<div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
    <div class="leaf-gradient p-8 text-white text-center">
        <h1 class="text-3xl font-bold mb-2">🌿 EcoAnalyzer AI</h1>
        <p class="opacity-90">Узнайте экологичность по названию или коду</p>
    </div>

    <div class="p-8">
        <div class="flex gap-2 mb-6">
            <button id="tabManual" onclick="showManual()" class="flex-1 py-3 rounded-xl bg-green-600 text-white font-semibold transition">
                ✍️ Ввод
            </button>
            <button id="tabScanner" onclick="showScanner()" class="flex-1 py-3 rounded-xl bg-gray-200 text-gray-700 font-semibold transition">
                📷 Сканер
            </button>
        </div>

        <div id="manualBlock">
            <input id="productInput" placeholder="Например: Snickers или Aqua Minerale" class="w-full p-4 border-2 rounded-xl mb-4 focus:border-green-500 outline-none">
            <button onclick="analyzeProduct()" class="w-full leaf-gradient text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition">
                Проверить продукт
            </button>
        </div>

        <div id="scannerBlock" class="hidden">
            <div id="reader" class="w-full rounded-xl overflow-hidden border-2 border-dashed border-gray-300"></div>
            <p class="text-sm text-gray-500 text-center mt-3">Наведите на штрих-код товара</p>
        </div>

        <div id="loader" class="hidden mt-6 text-center">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-green-500 border-t-transparent rounded-full"></div>
            <p id="loaderText" class="text-gray-500 mt-2">ИИ анализирует...</p>
        </div>

        <div id="result" class="hidden mt-6 p-6 bg-gray-50 rounded-2xl border border-green-100">
            <h3 class="text-xl font-semibold mb-3 text-green-800">Результат анализа</h3>
            <div id="aiResponse" class="text-gray-700 leading-relaxed space-y-2"></div>
        </div>
    </div>
</div>

<script>
    const apiKey = "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";
    let html5Qr;

    function showManual() {
        document.getElementById("manualBlock").classList.remove("hidden");
        document.getElementById("scannerBlock").classList.add("hidden");
        document.getElementById("tabManual").className = "flex-1 py-3 rounded-xl bg-green-600 text-white font-semibold";
        document.getElementById("tabScanner").className = "flex-1 py-3 rounded-xl bg-gray-200 text-gray-700 font-semibold";
        stopScanner();
    }

    function showScanner() {
        document.getElementById("scannerBlock").classList.remove("hidden");
        document.getElementById("manualBlock").classList.add("hidden");
        document.getElementById("tabScanner").className = "flex-1 py-3 rounded-xl bg-green-600 text-white font-semibold";
        document.getElementById("tabManual").className = "flex-1 py-3 rounded-xl bg-gray-200 text-gray-700 font-semibold";
        startScanner();
    }

    async function analyzeProduct(manualName = null) {
        let product = manualName || document.getElementById("productInput").value;
        if (!product) return alert("Введите название или отсканируйте код");

        const loader = document.getElementById("loader");
        const result = document.getElementById("result");
        const aiResponse = document.getElementById("aiResponse");
        const loaderText = document.getElementById("loaderText");

        loader.classList.remove("hidden");
        result.classList.add("hidden");

        // Если это штрих-код, сначала ищем в базе OpenFoodFacts
        if (/^\d+$/.test(product.trim())) {
            loaderText.innerText = "Распознаем код товара...";
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${product.trim()}.json`);
                const data = await res.json();
                if (data.status === 1) {
                    product = data.product.product_name || data.product.generic_name || product;
                }
            } catch (e) { console.log("Database fetch error"); }
        }

        loaderText.innerText = `Анализируем ${product}...`;

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json",
                    "HTTP-Referer": window.location.origin // Важно для стабильной работы OpenRouter
                },
                body: JSON.stringify({
                    model: "google/gemini-2.0-flash-exp:free", // Используем более мощную бесплатную модель
                    messages: [
                        {
                            role: "system",
                            content: "Ты — профессиональный экологический эксперт. Твоя задача: проанализировать указанный товар. Даже если ты не видишь его в реальном времени, используй свои знания о типичном составе этого бренда/категории. Оценивай: 1. Состав (вредность), 2. Упаковку (пластик/бумага), 3. Переработку. В конце поставь жирный Eco-Score: X/100. Пиши только на русском языке, используй эмодзи."
                        },
                        {
                            role: "user",
                            content: `Проанализируй экологичность товара: ${product}`
                        }
                    ]
                })
            });

            const data = await response.json();
            
            if (data.choices && data.choices[0]) {
                const text = data.choices[0].message.content;
                aiResponse.innerHTML = `<strong>Товар:</strong> ${product}<br><br>${text.replace(/\n/g, "<br>")}`;
                result.classList.remove("hidden");
            } else {
                throw new Error("Пустой ответ от ИИ");
            }

        } catch (error) {
            console.error(error);
            alert("Ошибка ИИ. Попробуйте еще раз через минуту (возможно, лимит запросов).");
        } finally {
            loader.classList.add("hidden");
        }
    }

    function startScanner() {
        html5Qr = new Html5Qrcode("reader");
        const config = { fps: 15, qrbox: { width: 250, height: 150 } };
        
        html5Qr.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
                if (navigator.vibrate) navigator.vibrate(100);
                stopScanner();
                analyzeProduct(decodedText);
            }
        ).catch(err => {
            alert("Камера недоступна. Убедитесь, что сайт открыт через HTTPS.");
        });
    }

    function stopScanner() {
        if (html5Qr && html5Qr.isScanning) {
            html5Qr.stop().then(() => {
                document.getElementById("reader").innerHTML = "";
            });
        }
    }
</script>
</body>
</html>
